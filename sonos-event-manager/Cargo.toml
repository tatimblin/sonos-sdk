[package]
name = "sonos-sdk-event-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal event subscription orchestration for sonos-sdk"
readme = "README.md"

[lib]
name = "sonos_event_manager"

[dependencies]
# Local workspace dependencies
sonos-api = { path = "../sonos-api", version = "0.8.0" }
sonos-stream = { package = "sonos-sdk-stream", path = "../sonos-stream", version = "0.8.0" }
sonos-discovery = { package = "sonos-sdk-discovery", path = "../sonos-discovery", version = "0.8.0" }

# Async runtime and utilities
tokio = { workspace = true }

# Error handling and utilities
thiserror = { workspace = true }
tracing = { workspace = true }

# Non-poisoning locks for Drop safety
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
