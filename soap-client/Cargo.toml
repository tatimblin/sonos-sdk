[package]
name = "sonos-sdk-soap-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal SOAP client for sonos-sdk UPnP device communication"
readme = "README.md"

[lib]
name = "soap_client"

[dependencies]
# Pinned to 2.x: 3.x removes `Agent::request`, `Error::Status` and
# `Error::Transport`, all of which this crate still uses.
ureq = { version = "2.9", features = ["json"] }
quick-xml = { version = "0.31", features = ["serialize"] }
thiserror = "2.0"
