[package]
name = "sonos-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Sync-first, DOM-like SDK for controlling Sonos speakers via UPnP"
readme = "README.md"

[dependencies]
sonos-state = { package = "sonos-sdk-state", path = "../sonos-state", version = "0.7.1" }
sonos-api = { path = "../sonos-api", version = "0.7.1" }
sonos-discovery = { package = "sonos-sdk-discovery", path = "../sonos-discovery", version = "0.7.1" }
sonos-event-manager = { package = "sonos-sdk-event-manager", path = "../sonos-event-manager", version = "0.7.1" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"

[features]
test-support = []

[dev-dependencies]
proptest = { workspace = true }
chrono = "0.4"
ctrlc = "3.4"
tracing-subscriber = { workspace = true }

[[example]]
name = "smart_dashboard"
path = "examples/smart_dashboard.rs"

[[example]]
name = "property_observer"
path = "examples/property_observer.rs"

[lints]
workspace = true
