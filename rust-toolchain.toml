[toolchain]
# Pinned so local `cargo clippy` matches CI exactly. Without this, lints that
# vary between rustc releases (e.g. `uninlined_format_args`) fire locally but
# not in CI, or vice versa.
#
# CI installs this same version explicitly via `PINNED_TOOLCHAIN` in ci.yml,
# which the `toolchain-sync` job asserts matches the channel below. Note that
# `dtolnay/rust-toolchain` ignores this file, so any job that needs a *different*
# toolchain must set `RUSTUP_TOOLCHAIN` to escape it -- see the `msrv` job.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
