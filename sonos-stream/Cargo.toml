[package]
name = "sonos-sdk-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal event streaming and subscription management for sonos-sdk"
readme = "README.md"

[lib]
name = "sonos_stream"

[dependencies]
# Local workspace dependencies
callback-server = { package = "sonos-sdk-callback-server", path = "../callback-server", version = "0.8.0" }
sonos-api = { path = "../sonos-api", version = "0.8.0" }

# Async runtime and utilities
tokio = { workspace = true }
futures = "0.3"

# Serialization and data handling
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling and utilities
thiserror = { workspace = true }
async-trait = "0.1"

# Logging
tracing = { workspace = true }

[dev-dependencies]
sonos-discovery = { package = "sonos-sdk-discovery", path = "../sonos-discovery", version = "0.8.0" }
# Used by the `live_demo` example, which CI compiles via `--all-targets`.
tracing-subscriber = { workspace = true }

[features]
default = ["firewall-detection"]
firewall-detection = []  # Enable proactive firewall detection

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
required-features = ["firewall-detection"]

[[example]]
name = "async_realtime"
path = "examples/async_realtime.rs"
required-features = ["firewall-detection"]

[[example]]
name = "firewall_handling"
path = "examples/firewall_handling.rs"
required-features = ["firewall-detection"]

[[example]]
name = "filtering_and_batch"
path = "examples/filtering_and_batch.rs"
required-features = ["firewall-detection"]

[[example]]
name = "live_demo"
path = "examples/live_demo.rs"
required-features = ["firewall-detection"]

[lints]
workspace = true
