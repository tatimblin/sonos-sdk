[package]
name = "sonos-sdk-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal event streaming and subscription management for sonos-sdk"
readme = "README.md"

[lib]
name = "sonos_stream"

[dependencies]
# Local workspace dependencies
callback-server = { package = "sonos-sdk-callback-server", path = "../callback-server", version = "0.7.0" }
sonos-api = { path = "../sonos-api", version = "0.7.0" }

# Async runtime and utilities
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }

# Error handling and utilities
thiserror = "1.0"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { workspace = true }

[dev-dependencies]
sonos-discovery = { package = "sonos-sdk-discovery", path = "../sonos-discovery", version = "0.7.0" }
rstest = "0.18"
proptest = "1.0"
tokio-test = "0.4"
mockall = "0.11"

[features]
default = ["firewall-detection"]
firewall-detection = []  # Enable proactive firewall detection

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
required-features = ["firewall-detection"]

[[example]]
name = "async_realtime"
path = "examples/async_realtime.rs"
required-features = ["firewall-detection"]

[[example]]
name = "firewall_handling"
path = "examples/firewall_handling.rs"
required-features = ["firewall-detection"]

[[example]]
name = "filtering_and_batch"
path = "examples/filtering_and_batch.rs"
required-features = ["firewall-detection"]

[[example]]
name = "live_demo"
path = "examples/live_demo.rs"
required-features = ["firewall-detection"]
