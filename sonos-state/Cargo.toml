[package]
name = "sonos-sdk-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal reactive state management for sonos-sdk"
readme = "README.md"
exclude = ["plans/"]

[lib]
